<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard RSVP Rahasia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-6">

    <!-- Login Section -->
    <div id="loginSection" class="max-w-sm mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Akses Terbatas</h2>
        <input type="password" id="passwordInput" class="w-full border border-gray-300 rounded px-4 py-2 mb-4" placeholder="Masukkan Password">
        <button onclick="checkPassword()" class="w-full bg-red-700 text-white font-bold py-2 rounded hover:bg-red-800">Masuk</button>
        <p id="loginError" class="text-red-500 text-sm mt-2 hidden">Password salah.</p>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="max-w-5xl mx-auto hidden">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Data RSVP Pernikahan</h1>
            <button onclick="fetchData()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Refresh Data</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-yellow-500">
                <h3 class="text-gray-500 text-sm font-bold uppercase mb-1">Total Tamu Mengisi</h3>
                <p id="totalResponds" class="text-3xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-bold uppercase mb-1">Total Hadir (Orang)</h3>
                <p id="totalAttending" class="text-3xl font-bold text-green-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-red-500">
                <h3 class="text-gray-500 text-sm font-bold uppercase mb-1">Tidak Hadir (Keluarga)</h3>
                <p id="totalNotAttending" class="text-3xl font-bold text-red-600">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Chart -->
            <div class="bg-white p-6 rounded-xl shadow lg:col-span-1">
                <h3 class="font-bold text-gray-800 mb-4">Persentase Kehadiran</h3>
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="rsvpChart"></canvas>
                </div>
            </div>
            
            <!-- Table -->
            <div class="bg-white p-6 rounded-xl shadow lg:col-span-2 overflow-x-auto">
                <h3 class="font-bold text-gray-800 mb-4">Daftar Tamu</h3>
                <table class="min-w-full text-left text-sm whitespace-nowrap">
                    <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50">
                        <tr>
                            <th class="px-4 py-3">Waktu</th>
                            <th class="px-4 py-3">Nama Lengkap</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3 text-center">Jumlah Orang</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200">
                        <tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbycb-LN1YtyFYWdBoVyozntR_Fzp8kfoX8MqtsoWf8DsJ1rNGVsIwnHJcdMxKtrMSg/exec?sheet=RSVP";
        let rsvpChartInstance = null;

        function checkPassword() {
            const val = document.getElementById('passwordInput').value;
            // Password simpel: effremeka2026
            if (val === 'effremeka2026') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                fetchData();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function fetchData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">Memuat data dari Google Sheets...</td></tr>';
            
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    renderDashboard(data);
                })
                .catch(err => {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-center text-red-500">Gagal memuat data.</td></tr>';
                    console.error(err);
                });
        }

        function renderDashboard(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0 || data.error) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">Belum ada data RSVP.</td></tr>';
                return;
            }

            let totalResponds = 0;
            let totalAttendingHeads = 0;
            let totalNotAttending = 0;
            let hadirCount = 0; // for chart

            data.forEach(row => {
                totalResponds++;
                const isHadir = row.status === 'Hadir';
                
                if (isHadir) {
                    hadirCount++;
                    totalAttendingHeads += (parseInt(row.count) || 0);
                } else {
                    totalNotAttending++;
                }

                const dateStr = new Date(row.timestamp).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', hour:'2-digit', minute:'2-digit'});
                const statusBadge = isHadir 
                    ? '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Hadir</span>'
                    : '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Tidak Hadir</span>';
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-4 py-3 text-gray-500">${dateStr}</td>
                    <td class="px-4 py-3 font-bold text-gray-800">${row.name}</td>
                    <td class="px-4 py-3">${statusBadge}</td>
                    <td class="px-4 py-3 text-center">${isHadir ? row.count : '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalResponds').textContent = totalResponds;
            document.getElementById('totalAttending').textContent = totalAttendingHeads;
            document.getElementById('totalNotAttending').textContent = totalNotAttending;

            // Render Chart
            const ctx = document.getElementById('rsvpChart').getContext('2d');
            if (rsvpChartInstance) {
                rsvpChartInstance.destroy();
            }
            rsvpChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Hadir', 'Tidak Hadir'],
                    datasets: [{
                        data: [hadirCount, totalNotAttending],
                        backgroundColor: ['#10B981', '#EF4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }
    </script>
</body>
</html>
