<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Undangan Tidak Ditemukan — Effrem &amp; Eka</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Lato:ital,wght@0,300;0,400;0,700;1,400&amp;family=Great+Vibes&amp;display=block" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #EBB55F;
            --gold-bright: #FFC107;
            --red-dark: #8B0000;
            --red: #A12020;
            --cream: #FFE9A8;
            --bg: #050506;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            font-family: 'Lato', sans-serif;
            overflow: hidden;
            color: var(--cream);
        }

        /* ── Ambient glow background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 55% at 25% 55%, rgba(139, 0, 0, 0.18) 0%, transparent 100%),
                radial-gradient(ellipse 50% 40% at 80% 20%, rgba(235, 181, 95, 0.1) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Floating particles ── */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -10px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0;
            animation: floatUp var(--dur, 10s) linear var(--delay, 0s) infinite;
        }

        @keyframes floatUp {
            0%   { opacity: 0;   transform: translateY(0)    scale(0.5); }
            10%  { opacity: 0.5; }
            80%  { opacity: 0.2; }
            100% { opacity: 0;   transform: translateY(-105vh) scale(1); }
        }

        /* ── Main layout ── */
        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ── Glass card ── */
        .card {
            text-align: center;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(235, 181, 95, 0.18);
            border-radius: 24px;
            padding: 52px 40px 44px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 4px 6px rgba(0,0,0,0.1),
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(32px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }

        /* ── Cross icon ── */
        .icon-cross {
            display: inline-block;
            font-size: 1.8rem;
            color: var(--red);
            margin-bottom: 20px;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(161,32,32,0.4)); opacity: 0.75; }
            50%       { filter: drop-shadow(0 0 18px rgba(161,32,32,0.85)); opacity: 1; }
        }

        /* ── Couple name ── */
        .couple-name {
            font-family: 'Great Vibes', cursive;
            font-size: 2.6rem;
            color: var(--gold);
            text-shadow: 0 0 24px rgba(235, 181, 95, 0.35);
            margin-bottom: 8px;
            line-height: 1.1;
        }

        /* ── Divider ── */
        .divider {
            width: 72px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            margin: 20px auto 24px;
        }

        /* ── Label ── */
        .label {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(235, 181, 95, 0.45);
            margin-bottom: 16px;
        }

        /* ── Title ── */
        .title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        /* ── Message ── */
        .message {
            font-size: 0.88rem;
            font-weight: 300;
            color: rgba(255, 233, 168, 0.6);
            line-height: 1.9;
            margin-bottom: 36px;
        }

        /* ── CTA Button ── */
        .btn-wa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--gold-bright);
            color: var(--red-dark);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(255, 193, 7, 0.28);
        }

        .btn-wa:hover, .btn-wa:focus {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(255, 193, 7, 0.48);
            outline: none;
        }

        .btn-wa:active { transform: translateY(-1px); }

        /* ── Footer ── */
        .footer {
            margin-top: 36px;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.18);
        }
    </style>
</head>
<body>

    <!-- Floating particles -->
    <div class="particles" aria-hidden="true">
        <div class="particle" style="left:10%;  --dur:11s; --delay:0s;"></div>
        <div class="particle" style="left:22%;  --dur:15s; --delay:2.5s;"></div>
        <div class="particle" style="left:38%;  --dur: 9s; --delay:1s;"></div>
        <div class="particle" style="left:54%;  --dur:13s; --delay:0.5s;"></div>
        <div class="particle" style="left:67%;  --dur:10s; --delay:3s;"></div>
        <div class="particle" style="left:80%;  --dur:14s; --delay:1.8s;"></div>
        <div class="particle" style="left:91%;  --dur: 8s; --delay:4s;"></div>
    </div>

    <div class="page" role="main">
        <div class="card">

            <i class="fas fa-cross icon-cross" aria-hidden="true"></i>

            <p class="couple-name">Effrem &amp; Eka</p>

            <div class="divider"></div>

            <p class="label">Undangan Digital</p>

            <h1 class="title">Tautan Tidak Ditemukan</h1>

            <p class="message">
                Maaf, tautan undangan yang Anda akses<br>
                tidak valid atau telah dinonaktifkan.<br><br>
                Jika Anda merasa ini adalah kesalahan,<br>
                silakan hubungi kami melalui WhatsApp.
            </p>

            <a href="https://wa.me/62" id="wa-btn" class="btn-wa" aria-label="Hubungi kami via WhatsApp">
                <i class="fab fa-whatsapp" aria-hidden="true"></i>
                Hubungi Kami
            </a>

            <p class="footer">Effrem &amp; Eka &middot; 25 Juli 2026</p>

        </div>
    </div>

    <script>
        // Update with the couple's WhatsApp number (without leading 0)
        // e.g. 6281234567890 for 081234567890
        // document.getElementById('wa-btn').href = 'https://wa.me/6281234567890';
    </script>

</body>
</html>
